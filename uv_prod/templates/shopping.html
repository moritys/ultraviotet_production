{% block title %}

{% endblock %}

{% block content %}

  <div class="container">
    <h1 class="title">
      Это страница со списком покупок

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

  {% endwith %}

  </div>

{% endblock %}
