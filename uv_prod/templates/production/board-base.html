{% extends "production/production.html" %}
{% block production %}

<section class="section">
  <div class="container">
    <h1 class="title">
      {{ board.name }}
    </h1>
  </div>

  <form class="box">
    <div class="field">
      <div class="columns">

        <div class="column">
        <h5 class="subtitle">Состояние шлейфа</h5>
          {% for stage in board_scheme_list %}
          <label class="label">{{ stage.stage }}: 0</label>
          <div class="field has-addons">
            <div class="control">
              <input class="input" type="text" placeholder="100">
            </div>
            <div class="control">
              <button class="button is-success is-light">
                Добавить
              </button>
            </div>
          </div>
          {% endfor %}
        </div>

        <div class="column">
            <h5 class="subtitle">Состояние платы</h5>
              {% for stage in board_scheme_list %}
              <label class="label">{{ stage.stage }}: 0</label>
              <div class="field has-addons">
                <div class="control">
                  <input class="input" type="text" placeholder="100">
                </div>
                <div class="control">
                  <button class="button is-success is-light">
                    Добавить
                  </button>
                </div>
              </div>
              {% endfor %}
            </div>
        
      </div>
    </div>
  </form>

</section>

{% endblock %}
