{% extends "base.html" %}
{% load static %}
{% block title %}
  Производство плат
{% endblock %}
{% block content %}
<section class="section">
<div class="container">
  <div class="box">
    <div class="field">
      <h5 class="subtitle">Количество производимых плат</h5>

      <div class="columns">

        {% for board in board_list %}
        <div class="column">
          <form class="box" method="post">
            {% csrf_token %}
          <input type="hidden" name="hidden_stage" value="Новый заказ">
          <input type="hidden" name="hidden_board" value="{{ board.name }}">
          <label class="label">{{ board.name }}: 
            {{ board.total_production_quantity }}</label>
          <div class="field has-addons">
            <p class="control is-expanded">
              {{ form.quantity }}
            </p>
            <div class="control">
              <button class="button is-success is-light" type="submit">
                Добавить
              </button>
            </div>
            
          </div>
        </form>
          <a class="button is-success is-light is-fullwidth" href="{% url 'production:board_production' board.slug %}" 
            {% if slug == board.slug %} title="Куда перейти? Ты уже тут" disabled
            {% endif %}>Перейти
          </a>
        
        </div>
      
        {% endfor %}
      </div>
    </div>
  </div>
</div>

<div class="container">
  {% block production %}
  <div id="production-data">
    <!-- Здесь будут отображаться данные о производстве плат -->
  </div>
  {% endblock %}
</div>

</section>

{% endblock %}
