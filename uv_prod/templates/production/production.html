{% extends "base.html" %}
{% block content %}
<section class="section">

  {% comment %} <div class="container">
    <progress class="progress is-success" value="15" max="100">15%</progress>
  </div> {% endcomment %}

  <form class="box">
    <div class="field">
      <h5 class="subtitle">Количество производимых плат</h5>

      <div class="columns">
        <div class="column">
          <label class="label">Круглые: 0</label>
          <div class="field has-addons">
            <div class="control">
              <input class="input" type="text" placeholder="100">
            </div>
            <div class="control">
              <button class="button is-info">
                Добавить
              </button>
            </div>
          </div>
        </div>

        <div class="column">
          <label class="label">Квадратные: 0</label>
          <div class="field has-addons">
            <div class="control">
              <input class="input" type="text" placeholder="100">
            </div>
            <div class="control">
              <button class="button is-info">
                Добавить
              </button>
            </div>
          </div>
        </div>

        <div class="column">
          <label class="label">Треугольные: 0</label>
          <div class="field has-addons">
            <div class="control">
              <input class="input" type="text" placeholder="100">
            </div>
            <div class="control">
              <button class="button is-info">
                Добавить
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>

  <div class="tabs is-centered is-boxed">
    <ul>
      <li class="is-active"><a>Круглые</a>
        <div class="columns">

        <div class="column">
          <form class="box">
            <div class="field">
              <h5 class="subtitle">Состояния шлейфа</h5>
              <label class="label">Шлейф неподрезанный: 0</label>
              <div class="field has-addons">
                <div class="control">
                  <input class="input" type="text" placeholder="100">
                </div>
                <div class="control">
                  <button class="button is-info">
                    Добавить
                  </button>
                </div>
              </div>

              <label class="label">Шлейф подрезанный: 0</label>
              <div class="field has-addons">
                <div class="control">
                  <input class="input" type="text" placeholder="100">
                </div>
                <div class="control">
                  <button class="button is-info">
                    Добавить
                  </button>
                </div>
              </div>

              <label class="label">Шлейф зачищенный: 0</label>
              <div class="field has-addons">
                <div class="control">
                  <input class="input" type="text" placeholder="100">
                </div>
                <div class="control">
                  <button class="button is-info">
                    Добавить
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>

        <div class="column">
          <form class="box">
            <div class="field">
              <h5 class="subtitle">Состояния платы</h5>
              <label class="label">Плата пустая: 0</label>
              <div class="field has-addons">
                <div class="control">
                  <input class="input" type="text" placeholder="100">
                </div>
                <div class="control">
                  <button class="button is-info">
                    Добавить
                  </button>
                </div>
              </div>

              <label class="label">Плата запаянная (с одной стороны): 0</label>
              <div class="field has-addons">
                <div class="control">
                  <input class="input" type="text" placeholder="100">
                </div>
                <div class="control">
                  <button class="button is-info">
                    Добавить
                  </button>
                </div>
              </div>

              <label class="label">Плата запаянная (с обоих сторон): 0</label>
              <div class="field has-addons">
                <div class="control">
                  <input class="input" type="text" placeholder="100">
                </div>
                <div class="control">
                  <button class="button is-info">
                    Добавить
                  </button>
                </div>
              </div>

              <label class="label">Плата обесперемыченная: 0</label>
              <div class="field has-addons">
                <div class="control">
                  <input class="input" type="text" placeholder="100">
                </div>
                <div class="control">
                  <button class="button is-info">
                    Добавить
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </li>

      <li><a>Квадратные</a>
      </li>
      <li><a>Треугольные</a>
      </li>
    </ul>
  </div>
</section>
{% endblock %}
