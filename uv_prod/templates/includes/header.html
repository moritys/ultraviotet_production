{% load static %}
{% with request.resolver_match.view_name as view_name %}
<header>
  <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>
  
    <div id="navbarBasicExample" class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item 
        {% if view_name  == 'homepage:index' %}is-active {% endif %}" 
        href="{% url 'homepage:index' %}">
          Главная
        </a>
  
        <a class="navbar-item 
        {% if view_name  == 'catalog:catalog' %}is-active{% endif %}"
        href="{% url 'catalog:catalog' %}">
          Компоненты на складе
        </a>

        <a class="navbar-item 
        {% if view_name  == 'production:production' %}is-active{% endif %}"
        href="{% url 'production:production' %}">
          Производство
        </a>

        <a class="navbar-item 
        {% if view_name  == 'shopping:shopping' %}is-active{% endif %}"
        href="{% url 'shopping:shopping' %}">
          Список покупок
        </a>
      </div>
  
      <div class="navbar-end">
        <div class="navbar-item">
          <div class="buttons">
            <a class="button is-primary">
              <strong>Sign up</strong>
            </a>
            <a class="button is-light">
              Log in
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
{% endwith %}

<script>
document.addEventListener('DOMContentLoaded', () => {

  // Get all "navbar-burger" elements
  const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);

  // Add a click event on each of them
  $navbarBurgers.forEach( el => {
    el.addEventListener('click', () => {

      // Get the target from the "data-target" attribute
      const target = el.dataset.target;
      const $target = document.getElementById(target);

      // Toggle the "is-active" class on both the "navbar-burger" and the "navbar-menu"
      el.classList.toggle('is-active');
      $target.classList.toggle('is-active');

    });
  });
});
</script>
